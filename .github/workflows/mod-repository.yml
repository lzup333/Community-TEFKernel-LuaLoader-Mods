name: Sync LuaLoader Mod repository

on:
  push:
    branches: [main]
    paths:
      - 'packages/**'
  schedule:
    # UTC 02:17, 07:17, 12:17, 17:17 = 北京时间 10:17, 15:17, 20:17, 01:17
    - cron: '17 2,7,12,17 * * *'
  workflow_dispatch:
    inputs:
      rebuild_release:
        description: '重建并上传固定 Release 资产'
        required: true
        default: false
        type: boolean

permissions:
  contents: write

env:
  RELEASE_TAG: mod-repository

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Build package assets
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.rebuild_release == true)
        run: |
          mkdir -p "$RUNNER_TEMP/lualoader-mod-assets"
          python3 tools/lualoader_modrepo.py --repo . pack "$RUNNER_TEMP/lualoader-mod-assets" >/dev/null

      - name: Create fixed Release
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.rebuild_release == true)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --title 'LuaLoader Mod Repository' \
              --notes '自动维护的 LuaLoader Mod 包仓库。'
          fi

      - name: Upload Release Assets
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.rebuild_release == true)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for asset in "$RUNNER_TEMP"/lualoader-mod-assets/*.tefpkg; do
            gh release upload "$RELEASE_TAG" "$asset" --clobber
          done

      - name: Rebuild download-ranked index
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 tools/rebuild_release_index.py --repo . --tag "$RELEASE_TAG"

      - name: Commit updated index
        run: |
          if git diff --quiet -- index.json; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.json
          git commit -m 'chore: update Mod download ranking'
          git push
